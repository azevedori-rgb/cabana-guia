<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6F0E1; --cream-2:#EFE6D0; --green:#0A6B2C; --green-2:#0E8A39; --green-soft:#DCEBDF;
  --orange:#FF5028; --ink:#1C1C1A; --ink-2:#4A4A46; --ink-3:#8A8A82; --line:#D9D0BB; --white:#FFFFFF;
  --ok:#0A6B2C; --warn:#C98A00; --bad:#C62828; --folga:#3A3A36; --ferias:#1F6FB2; --outro:#FF5028;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:13px;color:var(--ink)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--green);color:#fff}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px}
.ver{font-size:11px;opacity:.8;margin-right:8px;font-variant-numeric:tabular-nums}
.brand svg.logo-wm{height:30px;width:auto;display:block}.brand .brand-sep{width:1.5px;height:26px;background:rgba(250,244,233,.45);border-radius:2px}
.login .logo-full{display:block;height:64px;width:auto;margin:0 auto 14px}
.pg .ph .plogo{height:28px;width:auto;margin-right:14px;flex:none}.pg .ph>div:first-child{display:flex;align-items:center}
.pg.dia .ph .plogo{height:34px}
.top .role{font-size:12px;opacity:.85}
.wrap{padding:18px 16px}
h1{font-size:24px;font-weight:800;letter-spacing:-.3px}
h2{font-size:16px;font-weight:700;margin-bottom:12px}
.sub{color:var(--ink-2);font-size:13px;margin-top:4px}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13px;background:var(--green);color:#fff}
.btn:hover{background:var(--green-2)}
.btn.orange{background:var(--orange)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.ghost:hover{background:var(--green-soft)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px}
.psec h2{display:flex;align-items:center;gap:10px}
.pnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.field input:focus,.field select:focus{outline:0;border-color:var(--green)}
.field.req label::after{content:" *";color:var(--orange)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink-3)}
.err{color:var(--bad);font-size:12px;font-weight:600;margin-top:8px}
.list{display:grid;gap:10px;margin-top:14px}
.item{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.item b{font-size:15px}
.item .meta{font-size:12px;color:var(--ink-2)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--green-soft);color:var(--green);margin-left:6px}
.tag.t-cid{background:#EFE6D0;color:var(--ink-2)}
.tag.t-cl{background:#E8E2D2;color:var(--ink)}
.tag.t-shopping{background:var(--green);color:#fff}
.tag.t-rua{background:var(--orange);color:#fff}
.tag.t-aeroporto{background:#1F6FB2;color:#fff}
.tag.t-com{background:#fff;border:1.5px solid var(--orange);color:#B8390F}
.tag.t-reg{font-family:'DM Sans';letter-spacing:.5px;margin-left:8px;padding:2px 9px}
.tag.t-reg.r-5x2{background:#1F6FB2;color:#fff}
.tag.t-reg.r-6x1{background:#7A3E9D;color:#fff}
.tag.t-reg.r-4x3{background:#0A6B2C;color:#fff}
.tag.t-reg.big{font-size:13px;padding:3px 11px;vertical-align:middle}
.pg .pgreg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;color:#fff;margin-left:4px;border:2px solid #111}
.pg .pgreg.r-5x2{background:#1F6FB2}.pg .pgreg.r-6x1{background:#7A3E9D;text-decoration:underline}.pg .pgreg.r-4x3{background:#0A6B2C}
.empty{padding:30px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:12px;margin-top:14px}

/* hours per day table */
table.hd{width:100%;border-collapse:collapse;margin-top:6px}
table.hd th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);padding:6px 4px;text-align:center;font-weight:700}
table.hd th:first-child{text-align:left}
table.hd td{padding:4px;text-align:center}
table.hd td:first-child{text-align:left;font-weight:600;font-size:12px}
table.hd input{width:68px;padding:6px 4px;border:1.5px solid var(--line);border-radius:6px;text-align:center;font-size:12px}
.metas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end}
.metas .total{background:var(--green-soft);border-radius:8px;padding:10px 12px;font-weight:800;color:var(--green);font-size:16px}
.metas .total small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2)}

/* editor */
.ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.resumo{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.tile small{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2)}
.tile b{font-size:22px;font-weight:800;color:var(--green);line-height:1.1}
.tile span{font-size:11px;color:var(--ink-2);margin-left:4px}
.tile.total{background:var(--green);border-color:var(--green)}
.tile.total small,.tile.total span{color:rgba(255,255,255,.8)}.tile.total b{color:#fff}
table.esc th.fer{background:#FFE3D8!important;color:#B8390F!important;outline:2px solid var(--orange);outline-offset:-2px}
table.esc th.fer em{display:block;font-style:normal;font-size:6.5px;font-weight:800;letter-spacing:.3px}
.ferbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;padding:10px 14px;background:#FFF3EE;border:1.5px solid var(--orange);border-radius:10px}
.ferbar b{color:#B8390F;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.ferchip{background:#fff;border:1.5px solid var(--orange);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.ferchip small{color:#8A3B00;font-weight:700;margin-left:4px}
.pg th.fer{background:#fff!important;color:#111!important;border:2px solid #111;background-image:repeating-linear-gradient(135deg,#FFE3D8 0 3px,#fff 3px 8px)!important}
.pg th.fer em{display:block;font-style:normal;font-size:.7em;font-weight:800}
.ancA{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);font-style:normal;font-size:9px;font-weight:900;color:var(--ink);background:#fff;margin-left:3px;vertical-align:middle;line-height:1}
.pg td.nm b.cdA{display:inline-block;width:14px;height:14px;line-height:11px;text-align:center;border:2px solid #111;border-radius:50%;font-size:9px;font-weight:900;margin-right:4px;background:#fff;color:#111}
.cell{position:relative}
.cell .mk{position:absolute;top:0;right:0;font-style:normal;font-size:7px;font-weight:800;line-height:1;padding:1px 3px;border-radius:0 4px 0 4px;background:rgba(0,0,0,.35);color:#fff}
.cell .mk.exc,.excm{background:var(--orange);color:#fff}
.cell .mk.fer{background:#B8390F;color:#fff}
.cell .mk.bal{background:#1F6FB2;color:#fff}
.aus-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;margin:2px 4px 2px 0;border:1px solid var(--line)}
.aus-chip.FERIAS{background:#FFE9A8;color:#6B4E00}.aus-chip.OUTRO{background:#E9E4F7;color:#3F2C7A}.aus-chip.VAZIO{background:#eee;color:#555}
.aus-x{cursor:pointer;margin-left:4px;border:0;border-radius:999px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;font-family:inherit}.aus-x:hover{filter:brightness(.9)}
.btn.sm{padding:3px 8px;font-size:11px}
table.esc.nm .c1.nm{left:58px;min-width:190px;border-right:2.5px solid var(--green)!important}
table.esc.nm td.c1 input.nmin{width:100%;padding:5px 6px;border:1.5px solid var(--line);border-radius:6px;font-size:12px;font-weight:700}
table.esc.nm td.aus{text-align:left;white-space:normal;min-width:220px}
.nomes-table td.aus{white-space:normal}
.cell .mk.pz{left:0;right:auto;border-radius:4px 0 4px 0;background:#7A3E9D;color:#fff}
.cell.exc{box-shadow:inset 0 0 0 2px var(--orange)}
b.excm{padding:0 4px;border-radius:3px}
.tl{display:grid;grid-template-columns:44px 1fr 1fr 1fr 44px;gap:14px;align-items:stretch;margin-top:16px}
.tl.tl2{grid-template-columns:44px 1fr 1fr 44px}
.tl-arrow:disabled{opacity:.35;cursor:default}
.tl-arrow{border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:28px;font-weight:800;border-radius:10px;cursor:pointer}
.tl-arrow:hover{background:var(--green-soft)}.tl-arrow:disabled{opacity:.25;cursor:default}
.mcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px}
.mcard.cur{border-color:var(--green);box-shadow:0 6px 24px rgba(10,107,44,.12)}
.mcard.prev,.mcard.next{opacity:.92}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start}
.mc-role{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:700}
.mcard h2{margin:2px 0 0;font-size:20px}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:12px}
.mc-h{font-size:9px;font-weight:800;color:var(--ink-3);text-align:center}
.mc-d{display:block;text-align:center;font-size:10px;font-weight:700;color:#fff;border-radius:4px;padding:4px 0;text-shadow:0 0 2px rgba(0,0,0,.35)}
.mc-d.fer{outline:2px solid var(--orange);outline-offset:-2px}
.mc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.mc-stats div{background:var(--cream);border-radius:8px;padding:6px 4px;text-align:center}
.mc-stats b{display:block;font-size:17px;color:var(--green)}.mc-stats small{font-size:9px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.mc-fer{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11px;color:#8A3B00;font-weight:600}
.tl-strip{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tl-pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;display:flex;gap:3px;align-items:baseline}
.tl-pill small{font-size:9px;color:var(--ink-3)}.tl-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}.tl-pill.on small{color:#ccc}
.tl-pill.pub{border-color:var(--green);color:var(--green)}.tl-pill.pub.on{background:var(--green);border-color:var(--green);color:#fff}
.af-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:12px}
.af-day{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.af-day b{font-size:13px;margin-right:6px}
.af-bars{display:flex;gap:2px;align-items:flex-end;height:44px;margin:6px 0 2px}
.af-col{flex:1;display:flex;align-items:flex-end;gap:1px;position:relative;height:100%}
.af-col i{display:block;flex:1;border-radius:2px 2px 0 0;min-height:1px}
.af-col small{position:absolute;bottom:-12px;left:0;right:0;text-align:center;font-size:7px;color:var(--ink-3)}
.af-bars{margin-bottom:14px}

.scroll{overflow-x:auto;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px}
table.esc{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
table.esc th,table.esc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
table.esc th{background:var(--cream-2);font-size:9px;text-transform:uppercase;letter-spacing:.2px;color:var(--ink-2);padding:4px 3px;text-align:center;position:sticky;top:0;z-index:3}
table.esc th.d{min-width:40px;width:40px;line-height:1.15;padding:3px 0}
table.esc th.d small{display:block;font-weight:800;font-size:11.5px;color:var(--ink)}
table.esc th.we,table.esc td.we{background:#F8F3E6}
table.esc th.wk,table.esc td.wk{border-left:2.5px solid var(--green)}
table.esc td{padding:2px 1px;vertical-align:middle;text-align:center}
table.esc .st{position:sticky;background:#fff;z-index:2}

.c0{left:0;min-width:58px}.c1{left:58px;min-width:96px}.c2{left:154px;min-width:62px}.c3{left:216px;min-width:60px;border-right:2.5px solid var(--green)!important}
.posw{display:inline-flex;align-items:center;gap:2px}
.posw select{width:36px!important;padding:3px 0!important;font-weight:800;border-radius:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* Cozinha = laranja sólido + listras (visível em P&B); Salão = verde vazado */
tr.ar-C td.c0{background:repeating-linear-gradient(135deg,#FFE3D8 0 4px,#fff 4px 8px)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.cell{display:block;width:100%;padding:3px 0;border-radius:4px;border:1px solid transparent;background:transparent;font-size:9.5px;line-height:1.25;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}

.cell.FERIAS{background:var(--ferias);color:#fff;font-weight:800;font-size:8.5px;letter-spacing:.3px;border-color:var(--ferias)}
.cell.VAZIO{color:var(--ink-3)}
.cell.OUTRO{background:var(--outro);color:#fff;font-weight:800;font-size:8px;overflow:hidden;text-overflow:ellipsis;border-color:var(--outro)}

/* popover */
.pop{position:fixed;z-index:50;background:#fff;border:1.5px solid var(--green);border-radius:12px;padding:14px;width:300px;max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);display:none}
.pop.show{display:block}
.pop h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2);margin-bottom:10px}

/* ---- impressão ---- */
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:7mm}
  @page dia{size:A4 portrait;margin:10mm}
  .pg.dia{page:dia;page-break-inside:avoid;page-break-after:auto}
  .pg.dia table,.pg.dia tr{page-break-inside:avoid}
  body{background:#fff}
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block;filter:grayscale(1)} /* PDF sai em preto e branco */
  .pg{page-break-after:always;width:100%}
  .pg:last-child{page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

  setSync('busy','● carregando…');
  try{
    const [rows,cfgRows]=await Promise.all([supaGet('cabana_escalas?select=id,loja,data,updated_at'),supaGet('cabana_escalas_config?select=id,data')]);
    const remoteCfg=(cfgRows[0]||{}).data;
    if(rows.length){
      state.lojasCfg=rows.map(r=>r.data);
      if(remoteCfg){state.contratos=Object.assign({},state.contratos,remoteCfg.contratos||{});state.lojas=remoteCfg.lojas||state.lojas;state.adminSenha=remoteCfg.adminSenha||state.adminSenha;if(remoteCfg.usuarios)state.usuarios=remoteCfg.usuarios;if(remoteCfg.travas)state.travas=remoteCfg.travas;if(remoteCfg.base&&remoteCfg.base.lojas)state.base=remoteCfg.base;if(remoteCfg.curvas)state.curvas=remoteCfg.curvas;}
      ensureContratos();
      localStorage.setItem(LS_KEY,JSON.stringify(state));
      const t=new Date();setSync('ok','● nuvem · '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));
    }else if(state.lojasCfg.length){
      markDirty();await flushSync();toast('Dados locais enviados para a nuvem');
    }else{setSync('ok','● nuvem (vazia)');}
  }catch(e){console.error(e);setSync('err','● nuvem indisponível — usando local');}
  fixMorumbiReforco();fixLiderancaDomingo();migrarLojasBase();
  render();
}
/* ---------- auth ---------- */
const AUTH_KEY='cabana_escala_auth';
let auth=null;try{auth=JSON.parse(localStorage.getItem(AUTH_KEY));}catch(e){}
function isAdmin(){return auth&&auth.role==='admin';}
function isGestor(){return auth&&auth.role==='gestor';}
function isStaff(){return isAdmin()||isGestor();} // admin ou gestor: editam espelhos, parâmetros, escalas
function isLoja(){return auth&&auth.role==='loja';}
const PERFIS={admin:'Admin',gestor:'Gestor'}; // gerentes de restaurante entram com a senha da loja (painel Lojas)
function usuarios(){return state.usuarios||(state.usuarios=[]);}
/* ---------- travas por mês (edição de nomes/ausências pela loja) ---------- */
// Regra: a loja monta a escala do mês M até o dia 20 do mês anterior. Depois disso o mês trava, salvo liberação do admin. Janela: mês corrente + 2.
function travaDe(ymk){return (state.travas||{})[ymk]||'auto';}
function prazoDe(y,m){let py=y,pm=m-1;if(pm<0){pm=11;py--;}return new Date(py,pm,20);} // dia 20 do mês anterior
function mesEditavelLoja(y,m){const k=ym(y,m),t=travaDe(k);if(t==='travado')return false;if(t==='liberado')return true;
  const hoje=new Date(),h=todayYM();const idx=ymIdx(y,m)-ymIdx(h.y,h.m);if(idx<0||idx>2)return false;return hoje<prazoDe(y,m);}
function motivoTrava(y,m){const k=ym(y,m),t=travaDe(k);if(t==='travado')return 'travado pelo administrador';if(t==='liberado')return '';const h=todayYM();const idx=ymIdx(y,m)-ymIdx(h.y,h.m);if(idx<0)return 'mês encerrado';if(idx>2)return 'ainda não aberto (janela: mês corrente + 2)';const pz=prazoDe(y,m);return `prazo encerrado em ${String(pz.getDate()).padStart(2,'0')}/${String(pz.getMonth()+1).padStart(2,'0')}`;}
function podeEditarMes(e){return isStaff()||mesEditavelLoja(e.ano,e.mes);}
function setTrava(k,v){state.travas=state.travas||{};if(v==='auto')delete state.travas[k];else state.travas[k]=v;save(true);openTravas();}
function contatosAdmin(){return usuarios().filter(u=>u.perfil==='admin'&&(u.nome||u.telefone)).map(u=>`${esc(u.nome||'Admin')}${u.telefone?' · '+esc(u.telefone):''}`).join(' | ');}
function myLoja(){return isLoja()?cfgOf(auth.lojaId):null;}
function logout(){auth=null;localStorage.removeItem(AUTH_KEY);view={name:'home'};render();}

function doLogin(){
  const senha=(document.getElementById('lgSenha').value||'').trim(),err=document.getElementById('lgErr');
  const entra=a=>{auth=a;localStorage.setItem(AUTH_KEY,JSON.stringify(auth));};
  if(loginTab==='admin'){const sel=document.getElementById('lgUser'),uid_=sel?sel.value:'';
    if(!uid_){if(senha===(state.adminSenha||'cabana2026')){entra({role:'admin',nome:'Administrador'});view={name:'home'};render();return;}err.textContent='Senha de administrador incorreta';return;}
    const u=usuarios().find(x=>x.id===uid_&&x.perfil==='admin');if(u&&senha===(u.senha||'')){entra({role:'admin',userId:u.id,nome:u.nome});view={name:'home'};render();return;}err.textContent='Senha incorreta';return;}
  if(loginTab==='gestor'){const sel=document.getElementById('lgUser'),u=usuarios().find(x=>x.id===(sel?sel.value:'')&&x.perfil==='gestor');
    if(u&&senha===(u.senha||'')){entra({role:'gestor',userId:u.id,nome:u.nome});view={name:'home'};render();return;}err.textContent=u?'Senha incorreta':'Escolha o gestor';return;}

/* converte espelhos mensais (modelo antigo) em: padrão semanal + regra de domingo + exceções por data */
function migrateLegacy(s){
  s.espelhos.forEach(e=>{
    let cfg=s.lojasCfg.find(c=>c.loja===e.loja);
    if(!cfg){
      cfg={id:e.id,loja:e.loja,cidade:e.cidade||'',clusterLoja:e.clusterLoja,clusterDelivery:e.clusterDelivery,tipo:e.tipo,turnos:e.turnos,hLoja:e.hLoja,hVendas:e.hVendas,
        posicoes:[],excecoes:{},nomes:{},status:{},criadoEm:e.criadoEm};
      s.lojasCfg.push(cfg);
      const y=e.ano,m=e.mes,n=daysInMonth(y,m),codes=codesOf(e);
      e.posicoes.forEach(p=>{
        const sem=[];
        for(let w=0;w<7;w++){const votes={};
          for(let d=1;d<=n;d++){if(dow(y,m,d)!==w)continue;const c=p.dias[key(y,m,d)];if(!c)continue;const sig=c.tipo==='T'?`T|${c.e}|${c.s}`:c.tipo==='FOLGA'?'FOLGA':null;if(!sig)continue;votes[sig]=(votes[sig]||0)+1;}
          const top=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0];
          sem[w]=!top?{tipo:'FOLGA'}:top[0]==='FOLGA'?{tipo:'FOLGA'}:{tipo:'T',e:top[0].split('|')[1],s:top[0].split('|')[2]};}
        let domingo=0;
        for(let d=1;d<=n;d++){if(dow(y,m,d)!==6)continue;const c=p.dias[key(y,m,d)];if(c&&c.tipo==='FOLGA'&&sem[6].tipo==='T'){domingo=Math.ceil(d/7);break;}}
        const code=codes[p.id],ancora=p.secao!=='lideranca'&&['C1','C2','S1','S2'].includes(code);
        const hSub=(p.secao==='lideranca'&&p.cargo==='Coordenador')?{e:'12:40',s:'21:00'}:(sem[6].tipo==='T'?{e:sem[6].e,s:sem[6].s}:{e:'',s:''});
        cfg.posicoes.push({id:p.id,secao:p.secao,area:p.area,cargo:p.cargo,contrato:p.contrato,formato:p.formato,ancora,domingo,semana:sem,hSub});
      });
    }
    const YM=ym(e.ano,e.mes);cfg.nomes[YM]=Object.assign({},cfg.nomes[YM]||{},e.nomes||{});
    cfg._contratos=s.contratos;const g=genMonth(cfg,e.ano,e.mes);
    e.posicoes.forEach(p=>{const gp=g.posicoes.find(x=>x.id===p.id);if(!gp)return;
      Object.entries(p.dias).forEach(([k,c])=>{const gc=gp.dias[k]||{tipo:'VAZIO'};
        const same=c.tipo===gc.tipo&&(c.tipo!=='T'||(c.e===gc.e&&c.s===gc.s))&&(c.tipo!=='OUTRO'||(c.obs||'')===(gc.obs||''));
        if(!same){(cfg.excecoes[k]=cfg.excecoes[k]||{})[p.id]={tipo:c.tipo,...(c.e?{e:c.e,s:c.s}:{}),...(c.obs?{obs:c.obs}:{})};}});});
  });
  s.espelhos_legacy=s.espelhos;delete s.espelhos;
}

const MAPA_LOJAS={'Barra-Shopping':'05','Moema':'09','Leopoldo':'02','Pinheiros':'22','Morumbi':'06','Alphaville':'11','Oscar Freire':'08','Campinas-Iguatemi':'13','Tatuapé':'32','Shopping-Eldorado':'15','Niteroi-Plaza Shopping':'14','Villa-Lobos':'07','Braz Leme':'12','Morumbi Town':'30','Shopping-Mooca':'27','Internacional Gru':'26','Campo Belo':'19','Botafogo':'23'};
function baseDe(){if(!state.base||!state.base.lojas){state.base={atualizadoEm:BASE_ATIVOS.atualizadoEm,lojas:BASE_ATIVOS.lojas.map(l=>({...l,gerente:{...l.gerente}})),colaboradores:BASE_ATIVOS.colaboradores.map(c=>({...c}))};}return state.base;}
function lojaBase(cod){return baseDe().lojas.find(l=>l.codigo===cod);}
function lojaBasePorNome(n){n=String(n||'').trim().toLowerCase();return baseDe().lojas.find(l=>l.nome.toLowerCase()===n||(l.nomeBase||'').toLowerCase()===n);}
function metaDe(cfg,y,m){ // meta de quadro (liderança + equipe) da loja para o mês; sem meta no mês, vale a última meta anterior
  const L=cfg.codigo?lojaBase(cfg.codigo):lojaBasePorNome(cfg.loja);const M=L&&L.metas;if(!M)return null;const k=ym(y,m);
  const ks=Object.keys(M).filter(x=>x<=k).sort();const kk=ks[ks.length-1];if(!kk)return null;const q=M[kk];if(!q||(q.lid==null&&q.equipe==null))return null;return {lid:+q.lid||0,equipe:+q.equipe||0,desde:kk};}
function mesCtx(){if(cur&&cur._ym)return {y:cur.ano,m:cur.mes};if(semDesde)return semDesde;return todayYM();}
function quadroStatus(cfg,y,m){if(y==null){const c=mesCtx();y=c.y;m=c.m;}const q=metaDe(cfg,y,m);if(!q)return null;const ps=(()=>{const e=genMonth(cfg,y,m);return e.posicoes;})();const lid=ps.filter(p=>p.secao==='lideranca').length,eq=ps.length-lid;return {q,lid,eq,y,m,ok:lid===q.lid&&eq===q.equipe};}
function quadroMsg(st){return `Meta do Admin para ${MESES[st.m]} ${st.y}: ${st.q.lid} liderança + ${st.q.equipe} equipe. Espelho tem ${st.lid} + ${st.eq}.`;}
function colabsDe(cfg){const cod=cfg.codigo||(lojaBasePorNome(cfg.loja)||{}).codigo;if(!cod)return [];return baseDe().colaboradores.filter(c=>c.loja===cod).slice().sort((a,b)=>a.nome.localeCompare(b.nome));}
function migrarLojasBase(){ // 1) lojas antigas do html viram franquias/próprias na base; 2) espelhos recebem código e nome da base
  const B=baseDe();let ch=false;
  LOJAS_PADRAO.concat(state.lojas||[]).forEach(n=>{if(MAPA_LOJAS[n]||lojaBasePorNome(n))return;const cod='F'+String(B.lojas.filter(l=>/^F/.test(l.codigo)).length+1).padStart(2,'0');B.lojas.push({codigo:cod,nome:n,nomeBase:'',tipoLoja:'Franquia',gerente:{nome:'',email:'',telefone:''}});ch=true;});
  state.lojasCfg.forEach(c=>{if(c.codigo)return;const cod=MAPA_LOJAS[c.loja]||(lojaBasePorNome(c.loja)||{}).codigo;if(!cod)return;const L=lojaBase(cod);if(!L)return;c.codigo=cod;if(c.loja!==L.nome){c.lojaAntiga=c.loja;c.loja=L.nome;}dirty.cfg.add(c.id);ch=true;});
  B.lojas.forEach(l=>{if(l.quadro){l.metas=l.metas||{};const k=ym(INICIO.y,INICIO.m);l.metas[k]=l.metas[k]||{...l.quadro};delete l.quadro;ch=true;}});
  state.lojasCfg.forEach(c=>{if((c.metaSalao||c.metaDelivery)&&!c.metasVenda){c.metasVenda={[ym(INICIO.y,INICIO.m)]:{salao:+c.metaSalao||0,delivery:+c.metaDelivery||0}};}if(c.metaSalao!=null||c.metaDelivery!=null||c.metaTotal!=null){delete c.metaSalao;delete c.metaDelivery;delete c.metaTotal;dirty.cfg.add(c.id);ch=true;}});
  // metas iniciais: loja com espelho e sem nenhuma meta recebe o tamanho atual do espelho a partir de Nov/26 (vale para todos os meses até ser alterada)
  state.lojasCfg.forEach(c=>{if(!c.codigo)return;const L=lojaBase(c.codigo);if(!L||(L.metas&&Object.keys(L.metas).length))return;const lid=c.posicoes.filter(p=>p.secao==='lideranca').length,eq=c.posicoes.length-lid;if(!c.posicoes.length)return;L.metas={[ym(INICIO.y,INICIO.m)]:{lid,equipe:eq}};ch=true;});
  // Guarulhos: só existe "Internacional Guarulhos" (código 26); entradas antigas (Guarulhos, Internacional Gru, DK GUARULHOS) são fundidas nela
  {const L26=lojaBase('26');if(L26){if(L26.nome!=='Internacional Guarulhos'){L26.nome='Internacional Guarulhos';ch=true;}
    const dup=B.lojas.filter(l=>l.codigo!=='26'&&/guarulhos|internacional gru/i.test(l.nome));
    dup.forEach(l=>{state.lojasCfg.forEach(c=>{if(c.codigo===l.codigo||c.loja===l.nome){c.codigo='26';c.lojaAntiga=c.lojaAntiga||c.loja;c.loja=L26.nome;dirty.cfg.add(c.id);}});usuarios().forEach(u=>(u.lojas||[]).forEach((n,i)=>{if(n===l.nome)u.lojas[i]=L26.nome;}));});
    if(dup.length){B.lojas=B.lojas.filter(l=>!dup.includes(l));ch=true;}
    state.lojasCfg.forEach(c=>{if(c.codigo==='26'&&c.loja!==L26.nome){c.loja=L26.nome;dirty.cfg.add(c.id);ch=true;}});}}
  // nomes da base sem "Shop" / "Vl" (pedido de 23/10)
  const REN={'05':'Barra','06':'Morumbi','07':'Lobos','15':'Eldorado'};Object.entries(REN).forEach(([cod,nome])=>{const L=lojaBase(cod);if(L&&/^(Shop |Barra Shop)/.test(L.nome)){L.nome=nome;state.lojasCfg.forEach(c=>{if(c.codigo===cod){c.loja=nome;dirty.cfg.add(c.id);}});ch=true;}});
  usuarios().forEach(u=>(u.lojas||[]).forEach((n,i)=>{const cod=MAPA_LOJAS[n];if(cod&&lojaBase(cod)){u.lojas[i]=lojaBase(cod).nome;ch=true;}}));
  if(ch){dirty.config=true;save();}
}

/* ---------- time helpers ---------- */
function toMin(t){if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const[h,m]=t.split(':').map(Number);return h*60+m;}
function span(e,s){const a=toMin(e),b=toMin(s);if(a==null||b==null)return 0;let d=b-a;if(d<0)d+=1440;return d;}
function fmtH(min){const h=Math.floor(min/60),m=Math.round(min%60);return h+'h'+String(m).padStart(2,'0');}

/* ---------- calendar ---------- */
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function dow(y,m,d){return (new Date(y,m,d).getDay()+6)%7;} // 0=Seg
function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
// weeks (Mon→Sun) intersecting month; each: {idx, days:[d...]}
function weeks(y,m){
  const n=daysInMonth(y,m),out=[];let cur=null;
  for(let d=1;d<=n;d++){const w=dow(y,m,d);if(!cur||w===0){cur={idx:out.length+1,days:[]};out.push(cur);}cur.days.push(d);}
  return out;
}

function render(){
  const app=document.getElementById('app');
  const rl=document.getElementById('roleLbl');if(rl)rl.textContent=isAdmin()?('Admin'+(auth.nome&&auth.nome!=='Administrador'?' · '+auth.nome:'')):isGestor()?('Gestor · '+(auth.nome||'')):isLoja()?('Restaurante · '+(myLoja()||{}).loja+(auth.nome?' · '+auth.nome:'')):'';
  const tr=document.getElementById('topRight');if(tr)tr.style.visibility=auth?'visible':'hidden';
  document.querySelectorAll('#topRight .btn').forEach(b=>{if(/Backup/.test(b.textContent))b.style.display=isAdmin()?'':'none';if(/Configura/.test(b.textContent))b.style.display=isStaff()?'':'none';});
  if(!auth){app.innerHTML=loginView();return;}
  if(isLoja()){const ok=['timeline','nomes'];if(!ok.includes(view.name)||(view.id&&view.id!==auth.lojaId)||(cur&&(cur._cfg?cur._cfg.id:cur.id)!==auth.lojaId&&view.name==='nomes')){view={name:'timeline',id:auth.lojaId};const t=todayYM();view.y=t.y;view.m=t.m;}}
  if(isGestor()&&view.name==='novo'&&!draft.editId){view={name:'home'};}
  if(view.name==='home')app.innerHTML=homeView();
  else if(view.name==='novo')app.innerHTML=novoView();
  else if(view.name==='editor')app.innerHTML=editorView();
  else if(view.name==='nomes')app.innerHTML=nomesView();
  else if(view.name==='timeline')app.innerHTML=timelineView();
  else if(view.name==='semana')app.innerHTML=semanaView();
}

let cur=null;
function cfgOf(id){return state.lojasCfg.find(c=>c.id===id);}
function pisoDe(cfg){const p=cfg.piso||{};return {abreC:+(p.abreC??2),abreS:+(p.abreS??2),fechaC:+(p.fechaC??2),fechaS:+(p.fechaS??2)};}
function pisoTxt(cfg){const p=pisoDe(cfg);return `abre ${p.abreC}C+${p.abreS}S · fecha ${p.fechaC}C+${p.fechaS}S`;}
function regimeOf(cfg){const v={};(cfg.posicoes||[]).filter(p=>p.secao!=='lideranca').forEach(p=>{const k=p.formato||'5x2';v[k]=(v[k]||0)+1;});const top=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];return top?top[0]:'5x2';}
function regimeTag(cfg,extra){const r=regimeOf(cfg);return `<span class="tag t-reg r-${r}${extra?' '+extra:''}">${r}</span>`;}
const INICIO={y:2026,m:10}; // primeiro mês com escala na ferramenta (Nov/26): nada antes disso é mostrado
const ymIdx=(y,m)=>y*12+m;
function todayYM(){const t=new Date();let y=t.getFullYear(),m=t.getMonth();if(ymIdx(y,m)<ymIdx(INICIO.y,INICIO.m)){y=INICIO.y;m=INICIO.m;}return {y,m};}
function openEditor(id,y,m){const c=cfgOf(id);if(y==null){const t=todayYM();y=t.y;m=t.m;}cur=genMonth(c,y,m);view={name:'editor'};render();window.scrollTo(0,0);}
function regen(){cur=genMonth(cur._cfg,cur.ano,cur.mes);}
function shiftMonth(delta){let y=cur.ano,m=cur.mes+delta;while(m<0){m+=12;y--;}while(m>11){m-=12;y++;}openEditor(cur.id,y,m);}
function secoesDo(e){return ['lideranca','almoco','noite',...(e.turnos===3?['madrugada']:[])];}

      <div class="chips"><span class="chip">${esc(e.cidade||'cidade não definida')}</span><span class="chip">Cluster ${e.clusterLoja}${e.clusterDelivery}</span><span class="chip">${e.tipo}</span><span class="chip">${e.turnos} turnos</span>
        <span class="chip">Loja ${e.hLoja[0].a}–${e.hLoja[0].f} (seg)</span>${metaMes(e._cfg,e._ym).total?`<span class="chip">Meta ${MESES[e.mes].slice(0,3)} ${brl(metaMes(e._cfg,e._ym).total)}</span>`:''}${e._versao?`<span class="chip" style="background:#FFF3E8;border-color:var(--orange)" title="Este mês usa o padrão anterior a uma mudança feita no espelho semanal">Padrão congelado (válido até ${e._versao.slice(5)}/${e._versao.slice(2,4)})</span>`:''}</div></div>
    <div class="row"><button class="btn ghost" onclick="openTimeline('${e.id}',${y},${m})">← Linha do tempo</button><button class="btn ghost" onclick="openSemana('${e.id}',${y},${m})">Espelho semanal</button><button class="btn ghost" onclick="editParams('${e.id}',${y},${m})">⚙ Parâmetros</button><button class="btn orange" onclick="openNomes('${e.id}',${y},${m})">Nomes & Imprimir →</button></div>
  </div>
  <div class="legend"><span class="hint"><b>Escala gerada</b> = padrão semanal × regra de domingo × exceções. Marcas no canto da célula: <b>D</b> folga de domingo · <b>S</b> dia trabalhado no lugar da folga · <b>F</b> troca por feriado (seg/ter ↔ qua/qui, só equipe) · <b>B</b> piso de abertura/fechamento (${pisoTxt(e._cfg)}; folga movida) · <b>T</b> troca ter↔qua (quarta sempre com mais gente) · <i class="ancA">A</i> ao lado da posição = âncora · <b>A</b> assumiu horário de âncora · <b>G</b> gerente cobrindo · <b>Q</b> compensação · <b>H</b> horas redistribuídas (liderança 44h) · <b>6</b> gerente 6h na segunda · <b>1</b> gerente não folga dia 1 · <b class="excm">E</b> exceção lançada à mão.</span></div>

    <span><i style="background:var(--ok);border-radius:50%"></i>cumpre contrato</span><span><i style="background:var(--warn);border-radius:50%"></i>abaixo das horas</span><span><i style="background:var(--bad);border-radius:50%"></i>excede horas ou falta folga</span>
    <span class="hint">· Nos turnos, <b style="background:var(--orange);color:#fff;padding:0 5px;border-radius:3px">C</b> = Cozinha e <b style="border:2px solid var(--green);color:var(--green);padding:0 4px;border-radius:3px">S</b> = Salão (C1, C2… / S1, S2…). Clique em um dia para editar. Semanas parciais têm meta proporcional.</span></div>
  ${resumoHTML(e)}
  ${alertasHTML(e)}
  ${secoesDo(e).map(s=>secaoHTML(e,s,n,wks)).join('')}

function coberturaHTML(e,n){
  const y=e.ano,m=e.mes;
  const ps=e.posicoes.filter(p=>p.secao!=='lideranca');
  // faixa de horas: da menor abertura ao maior fechamento da semana (fechamento após meia-noite soma 24h)
  let h0=24,h1=0;e.hLoja.forEach(h=>{const a=toMin(h.a),f0=toMin(h.f);if(a==null||f0==null)return;const f=f0<=a?f0+1440:f0;h0=Math.min(h0,Math.floor(a/60));h1=Math.max(h1,Math.ceil(f/60));});
  if(h1<=h0){h0=0;h1=24;}
  const hours=[];for(let h=h0;h<h1;h+=0.5)hours.push(h);
  const count=(d,h)=>{const k=key(y,m,d),t=h*60;let c=0;
    ps.forEach(p=>{const c0=p.dias[k];if(!c0||c0.tipo!=='T')return;const a=toMin(c0.e),b0=toMin(c0.s);if(a==null||b0==null)return;const b=b0<=a?b0+1440:b0;if(t>=a&&t<b)c++;});
    // quem entrou no dia anterior e virou a noite
    if(d>1){const kp=key(y,m,d-1),t2=t+1440;ps.forEach(p=>{const c0=p.dias[kp];if(!c0||c0.tipo!=='T')return;const a=toMin(c0.e),b0=toMin(c0.s);if(a==null||b0==null)return;const b=b0<=a?b0+1440:b0;if(b>1440&&t2>=a&&t2<b)c++;});}
    return c;};
  const aberta=(d,h)=>{const w=dow(y,m,d),hl=e.hLoja[w],a=toMin(hl.a),f0=toMin(hl.f);if(a==null||f0==null)return false;const f=f0<=a?f0+1440:f0;const t=h*60;return t>=a&&t<f;};
  let max=0;const grid=hours.map(h=>Array.from({length:n},(_,i)=>{const c=count(i+1,h);if(c>max)max=c;return c;}));
  const color=c=>{if(!c)return '#fff';const t=0.15+0.85*(c/max);return `rgba(10,107,44,${t.toFixed(2)})`;};
  let html=`<div class="secao"><div class="secao-h"><b>Cobertura · pessoas da equipe na loja a cada 30 min</b><span style="font-size:11px;opacity:.85">Atendentes dos turnos (Liderança não entra) · cinza = loja fechada</span></div><div class="scroll"><table class="esc heat">`;
  html+=`<tr><th class="st c0" style="min-width:58px">Hora</th>${Array.from({length:n},(_,i)=>{const d=i+1,w=dow(y,m,d);return `<th class="d ${w>=5?'we':''} ${w===0&&d>1?'wk':''}">${DIAS[w]}<small>${d}</small></th>`;}).join('')}<th class="sum" style="min-width:60px;width:60px">Méd.</th></tr>`;
  hours.forEach((h,hi)=>{const lbl=String(Math.floor(h%24)).padStart(2,'0')+(h%1?':30':':00');
    const vals=grid[hi];const open=vals.filter((_,i)=>aberta(i+1,h));const avg=open.length?(open.reduce((a,b)=>a+b,0)/open.length):0;

function weekBadge(e,p,w){
  const ct=ctOf(p),exp=FORMATOS[p.formato]||1;
  let min=0,folgas=0,ferias=0;
  w.days.forEach(d=>{const k=key(e.ano,e.mes,d),c=p.dias[k]||{tipo:'VAZIO'};
    if(c.tipo==='T'){const sp=span(c.e,c.s);if(sp>0)min+=Math.max(0,sp-(c.pausa!=null?+c.pausa:ct.pausa));}else if(c.tipo==='FOLGA')folgas++;else if(c.tipo==='FERIAS')ferias++;});
  const frac=w.days.length/7,target=ct.horas*60*frac,full=w.days.length===7;
  let st='ok';
  if(ferias===w.days.length)st='na';
  else if(min>target+20||(full&&folgas<exp))st='bad';
  else if(min<target-60)st='warn';
  return `<span class="wkb ${st}" title="Semana ${w.idx} · ${w.days.length} dias · meta ${fmtH(target)}"><i></i>S${w.idx} ${fmtH(min)} · ${folgas}F${full?'':'*'}</span>`;
}
function curCfg(){return cur._cfg||cur;}
function subDe(d){if(!d||d.tipo!=='T')return {e:'',s:''};const ex=(+d.pausa||60)-60;if(ex<=0)return {e:d.e,s:d.s};let x=toMin(d.s)-ex;x=((x%1440)+1440)%1440;return {e:d.e,s:hm(Math.floor(x/60),x%60)};}
function addPos(s){
  const cfg=curCfg(),lid=s==='lideranca';
  {const st=quadroStatus(cfg);if(st){const over=lid?st.lid+1>st.q.lid:st.eq+1>st.q.equipe;if(over){if(!isAdmin()){alert('Não é possível incluir: o espelho passaria da meta de quadro estabelecida pelo Admin.\n'+quadroMsg(st));return;}if(!confirm('Atenção: o espelho vai passar da meta de quadro definida para a loja.\n'+quadroMsg(st)+'\nIncluir mesmo assim?'))return;}}}
  if(view.name==='semana')cortarVersao(cfg); // posição nova vale a partir do mês escolhido no espelho semanal
  // Regra da rede: CLT = 5x2, 42h/semana → 8h24 trabalhadas + 1h pausa = 9h24 em loja por dia
  const p={id:uid(),secao:s,cargo:lid?'Gerente':'Atendente',contrato:'CLT',formato:'5x2',semana:[],hSub:{e:'',s:''},ancora:false,domingo:0};
  if(!lid)p.area='S';
  const ct=state.contratos.CLT,diaMin=Math.round(ct.horas*60/5)+ct.pausa;
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  // Almoço entra na abertura da loja; Noite/Madrugada saem no fechamento (abertura = 1ª pessoa chega, fechamento = última sai)
  const horario=w=>{const h=cfg.hLoja[w];if(s==='almoco'||s==='lideranca')return {e:h.a,s:addM(h.a,diaMin)};return {e:addM(h.f,-diaMin),s:h.f};};
  const same=cfg.posicoes.filter(x=>x.secao===s),idx=same.length;
  // 2 folgas/semana em dupla (seg–ter para a 1ª posição, depois gira); domingo de folga: 2º, 3º, 4º, 1º… rodando
  const f1=idx%6,f2=f1+1; // nunca domingo no padrão
  for(let w=0;w<7;w++)p.semana[w]=(w===f1||w===f2)?{tipo:'FOLGA'}:{tipo:'T',...horario(w)};
  p.hSub=subDe(p.semana[6]);
  p.domingo=[2,3,4,1][idx%4];
  if(!lid){const a=p.area;p.ancora=same.filter(x=>(x.area||'S')===a).length<2;}
  cfg.posicoes.push(p);save();if(view.name==='semana')render();else{regen();render();}
}
function delPos(id){const cfg=curCfg(),p=cfg.posicoes.find(x=>x.id===id);

function codesOf(e){

function genWeek(cfg,mon){ // mon = Date de segunda-feira → {pid:{key:cell}} para os 7 dias

  cfg.posicoes.forEach(p=>{

    days.forEach((dt,w)=>{st[dkey(dt)]={...(sem[w]||{tipo:'FOLGA'})};});
    // exceções por data (férias, vago, afastamento, horário manual) entram ANTES das regras, para o piso compensar com quem está presente

    const d1=days.findIndex(dt=>dt.getDate()===1);

        const hh=h||{e:'11:00',s:'20:00'};
        const covers=w=>{const hl=cfg.hLoja[w]||{};const A=toMin(hl.a),F0=toMin(hl.f);if(A==null||F0==null)return false;const F=F0<=A?F0+1440:F0;
          for(let t=A;t<F;t+=10){if(!lid.some(q=>q!==ger&&(()=>{const c=out[q.id][dkey(days[w])];if(c.tipo!=='T')return false;let e=toMin(c.e),b=toMin(c.s);if(b<=e)b+=1440;return e<=t&&b>t;})()))return false;}return true;};

        out[ger.id][k1]={tipo:'T',e:hh.e,s:hh.s,_d1:true};

  [0,1].forEach(w=>{const dt=days[w];if(!isFeriado(cfg,dt))return;const kF=dkey(dt);

  // PISO: sempre ≥2 da equipe na abertura e ≥2 no fechamento, todos os dias. Falta → move a folga de alguém para o dia com mais gente (mesmo de pico)
  const team=cfg.posicoes.filter(p=>p.secao!=='lideranca');
  if(team.length){
    const K=w=>dkey(days[w]),hl=w=>cfg.hLoja[w]||{};
    const AF=w=>{const A=toMin(hl(w).a),F0=toMin(hl(w).f);if(A==null||F0==null)return null;return {A,F:F0<=A?F0+1440:F0};};
    const isOpen=(c,w)=>{const x=AF(w);return !!(x&&c.tipo==='T'&&toMin(c.e)!=null&&toMin(c.e)<=x.A+15);};
    const isClose=(c,w)=>{const x=AF(w);if(!x||c.tipo!=='T')return false;let a=toMin(c.e),b=toMin(c.s);if(a==null||b==null)return false;if(b<=a)b+=1440;return b>=x.F-15;};

              for(const o of opts){const c=out[p.id][K(o.t)];

function ferCache(){return isFeriado._c||(isFeriado._c={});}
function isFeriado(cfg,dt){ // feriado nacional/local de verdade (ponto facultativo e vésperas não contam)
  const C=ferCache(),y=dt.getFullYear(),m=dt.getMonth(),ck=`${cfg.id}|${cfg.cidade||''}|${y}-${m}`;
  if(!C[ck])C[ck]=feriadosDoMes({ano:y,mes:m,cidade:cfg.cidade});
  const fs=C[ck][dt.getDate()];return !!(fs&&fs.some(f=>['Nacional','Municipal','Estadual SP','Estadual RJ'].includes(f.tipo)||/^Estadual/.test(f.tipo)));
}
function genMonth(cfg,y,m){
  try{cfg._contratos=state.contratos;}catch(e){}
  const n=daysInMonth(y,m),YM=ym(y,m),mon0=addDays(new Date(y,m,1),-dow(y,m,1)),last=new Date(y,m,n);
  const YMh=ym(y,m),hv=(cfg.historico||[]).find(v=>v.ate>=YMh);const gcfg=hv?{...cfg,posicoes:hv.posicoes}:cfg;
  const dias={};gcfg.posicoes.forEach(p=>dias[p.id]={});
  for(let mon=mon0;mon<=last;mon=addDays(mon,7)){const wk=genWeek(gcfg,mon);Object.entries(wk).forEach(([pid,st])=>Object.entries(st).forEach(([k,c])=>{if(k.startsWith(YM))dias[pid][k]=c;}));}
  cfg.excecoes=cfg.excecoes||{};cfg.nomes=cfg.nomes||{};cfg.status=cfg.status||{};
  Object.entries(cfg.excecoes).forEach(([k,mp])=>{if(!k.startsWith(YM))return;Object.entries(mp).forEach(([pid,c])=>{if(dias[pid])dias[pid][k]={...c,_exc:true};});});
  cfg.nomes[YM]=cfg.nomes[YM]||{};

}

let semDesde=null; // mês a partir do qual Montar padrão / Ajuste fino valem (meses anteriores ficam congelados)
function openSemana(id,y,m){cur=cfgOf(id);semDesde=(y!=null)?{y,m}:todayYM();view={name:'semana',id};render();window.scrollTo(0,0);}
function setSemDesde(v){const [y,m]=v.split('-').map(Number);semDesde={y,m:m-1};render();}
function cortarVersao(cfg){ // congela o padrão atual para os meses anteriores a semDesde
  if(!semDesde)return;const d=semDesde;const ymD=ym(d.y,d.m);

/* ---------- montar padrão semanal de um turno a partir das regras da rede ---------- */
function folgas5x2(nA,nR,n,pisoFn){ // escolhe pares de folga: âncoras em dias consecutivos (seg+ter, ter+qua, qua+qui), demais em dias separados
  const J=[[0,1],[1,2],[2,3]],S=[[0,1],[1,2],[2,3],[0,2],[0,3],[1,3],[0,4],[1,4],[2,4]];const joined=pr=>pr[1]-pr[0]===1;
  const W=[8,12,16,17],tot=2*n,ideal=W.map(w=>tot*w/53);
  const score=(fa,fr)=>{const f=[0,0,0,0,0];[...fa,...fr].forEach(pr=>pr.forEach(d=>f[d]++));const pres=f.map(x=>n-x);let sc=0;
    for(let d=0;d<4;d++)sc+=Math.max(0,pisoFn(d)-pres[d])*1000;
    if(pres[2]<=pres[1])sc+=500;if(pres[0]>pres[1])sc+=200;if(pres[3]<pres[2])sc+=200;sc+=f[4]*300;
    const fa2=[0,0,0,0,0];fa.forEach(pr=>pr.forEach(d=>fa2[d]++));sc+=fa2.filter(x=>x>=2).length*150;sc+=fr.filter(joined).length*30;
    for(let d=0;d<4;d++)sc+=Math.abs(pres[d]-ideal[d])*10;return sc;};
  const combos=(opts,k,allowRepeat)=>{const out=[];const rec=(st,cur)=>{if(cur.length===k){out.push(cur.slice());return;}for(let i=st;i<opts.length;i++){cur.push(opts[i]);rec(i,cur);cur.pop();}};rec(0,[]);return out;};
  let best=null;combos(J,nA).forEach(fa=>{combos(S,nR).forEach(fr=>{const sc=score(fa,fr);if(!best||sc<best.sc)best={sc,fa,fr};});});
  if(!best)return {anc:Array(nA).fill([0,1]),rest:Array(nR).fill([0,2])};
  const ord=pr=>(joined(pr)?0:100)+pr[0]*10+pr[1];return {anc:best.fa.slice().sort((x,y)=>ord(x)-ord(y)),rest:best.fr.slice().sort((x,y)=>ord(x)-ord(y))};
}
function autoPadraoLid(cfg,ps){ // regras da liderança: gerente folga ter + domingos alternados, 6h na segunda; coordenadores folgam seg/qua, 1 domingo a cada 4 semanas; ≥1 líder sempre; 44h fechadas pelo gerador
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  const ger=ps.filter(p=>p.cargo==='Gerente'),co=ps.filter(p=>p.cargo!=='Gerente');
  const AF=w=>{const h=cfg.hLoja[w];const A=toMin(h.a),F0=toMin(h.f);const F=F0<=A?F0+1440:F0;return {A,F,a:h.a,f:h.f};};
  const T=(e,s)=>({tipo:'T',e,s});const H=x=>hm(Math.floor(((x%1440)+1440)%1440/60),((x%1440)+1440)%1440%60);
  ger.forEach(p=>{p.contrato=p.contrato||'PJ';p.formato='6x1';p.ancora=false;p.domingo='alt';p.semana=[];
    for(let w=0;w<7;w++){const x=AF(w);
      if(w===1){p.semana[w]={tipo:'FOLGA'};continue;}
      if(w===0)p.semana[w]=T('06:00',H(Math.max(x.A+6*60,14*60+40)));           // segunda: estoque às 6h, fica até o fechador chegar
      else if(w===2)p.semana[w]=T(x.a,H(x.A+6*60));                               // quarta: abre, dia curto
      else if(w===3)p.semana[w]=T(H(Math.max(x.A,11*60)),H(Math.max(x.A,11*60)+7*60)); // quinta: 11h, dia médio
      else if(w===6)p.semana[w]=T(H(Math.max(x.A,11*60)),H(x.F-3*60));            // domingo: 11h até 3h antes de fechar
      else p.semana[w]=T(H(Math.max(x.A,11*60)),H(x.F-60));}                      // sex/sáb: 11h até 1h antes de fechar
    p.hSub={...p.semana[6]};delete p.hSub.tipo;});
  const span=8*60+20; // 7h20 + 1h de pausa (44h em 6 dias)
  co.forEach((p,i)=>{p.contrato=p.contrato||'PJ';p.formato='6x1';p.ancora=false;p.semana=[];
    const papel=i%3; // 0 = abre (folga seg) · 1 = fecha (folga qua) · 2 = meio (folga qui)
    p.domingo=papel===1?'q3':'q1';const fol=papel===0?0:papel===1?2:3;
    for(let w=0;w<7;w++){const x=AF(w);if(w===fol){p.semana[w]={tipo:'FOLGA'};continue;}
      if(papel===0){const fechaHoje=w===2&&co.length>=2;p.semana[w]=fechaHoje?T(H(x.F-span),x.f):T(x.a,H(x.A+span));} // quem abre fecha na quarta (dia do fechador folgar)
      else if(papel===1)p.semana[w]=T(H(x.F-span),x.f);
      else p.semana[w]=T('12:40',addM('12:40',span));}
    const d=p.semana[6];p.hSub=d.tipo==='T'?{e:d.e,s:d.s}:{e:'12:40',s:addM('12:40',span)};});
}
function autoPadrao(sec){
  const cfg=curCfg(),ps=cfg.posicoes.filter(p=>p.secao===sec);if(!ps.length)return;
  if(sec==='lideranca'){if(!confirm(`Montar o padrão da Liderança com as regras da rede?\nGerente: folga terça + domingos alternados, segunda às 6h. Coordenadores: folgas seg/qua (3º: qui), 1 domingo a cada 4 semanas. Horários são ajustados pelo gerador para 44h com ≥1 líder sempre.\nIsso sobrescreve horários, folgas e domingo das ${ps.length} posições.${semDesde&&ymIdx(semDesde.y,semDesde.m)>ymIdx(INICIO.y,INICIO.m)?`\nVale a partir de ${MESES[semDesde.m]} ${semDesde.y}; os meses anteriores ficam como estão.`:''}`))return;
    cortarVersao(cfg);autoPadraoLid(cfg,ps);save();render();toast('Padrão da Liderança montado');return;}
  if(!confirm(`Montar o padrão de ${SECOES[sec].nome} com as regras da rede?\nIsso sobrescreve horários, folgas, domingo nº e horário substituto das ${ps.length} posições deste turno (cargo, contrato, área e âncoras são mantidos).${semDesde&&ymIdx(semDesde.y,semDesde.m)>ymIdx(INICIO.y,INICIO.m)?`\nVale a partir de ${MESES[semDesde.m]} ${semDesde.y}; os meses anteriores ficam como estão.`:''}`))return;
  cortarVersao(cfg);
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  const isAlm=sec==='almoco';
  // regime do turno = formato/contrato da maioria das posições (5x2·42h ou 6x1·44h)
  const fmtVotes={};ps.forEach(p=>{const k=(p.formato||'5x2')+'|'+(p.contrato||'CLT');fmtVotes[k]=(fmtVotes[k]||0)+1;});
  const [fmt,ctr]=Object.entries(fmtVotes).sort((a,b)=>b[1]-a[1])[0][0].split('|');
  ensureContratos();
  const nFol=FORMATOS[fmt]||2,ct=state.contratos[ctr]||(nFol===1?state.contratos['CLT 6x1']:state.contratos.CLT)||{horas:nFol===1?44:42,pausa:60},diaMin=Math.round(ct.horas*60/(7-nFol))+(ct.pausa||0);
  const hAnc=w=>{const h=cfg.hLoja[w];return isAlm?{e:h.a,s:addM(h.a,diaMin)}:{e:addM(h.f,-diaMin),s:h.f};};
  const com=cfg.perfil==='comercial';
  // equilíbrio almoço × jantar (parâmetro da loja): almoço forte → reforço do almoço chega 1h após abrir (cobre só o almoço) · jantar forte → reforço da noite entra no horário de fechamento (cobre só o jantar) · equilíbrio → reforços às 11:30 (cobrem os dois picos)
  const pctAJ=cfg.pisoAlmocoPct==null?50:+cfg.pisoAlmocoPct,modoAJ=pctAJ>=75?'almoco':pctAJ<=37?'jantar':'eq';
  const hRef=w=>{const h=cfg.hLoja[w];if(isAlm){let e=modoAJ==='almoco'?toMin(h.a):Math.max(toMin(h.a)+60,11*60+30);const es=hm(Math.floor(e/60),e%60);return {e:es,s:addM(es,diaMin)};}
    if(sec==='noite'&&modoAJ==='jantar'){const A=toMin(h.a),F0=toMin(h.f),F=F0<=A?F0+1440:F0;const e=Math.max(A,F-diaMin);return {e:hm(Math.floor(e/60)%24,e%60),s:h.f};}
    if(sec==='noite'&&w>=4){const A=toMin(h.a),F0=toMin(h.f),F=F0<=A?F0+1440:F0;let e=Math.max(A,11*60+30);if(e+diaMin+60<=F)return {e:hm(Math.floor(e/60),e%60),s:addM(hm(Math.floor(e/60),e%60),diaMin+60),pausa:(ct.pausa||60)+60};}
    const A=toMin(h.a),F0=toMin(h.f),F=F0<=A?F0+1440:F0;let e=Math.min(12*60,F-diaMin-96);if(e<A)e=A;const s2=e+diaMin;if(s2>F){e=F-diaMin;}return {e:hm(Math.floor(e/60),e%60),s:addM(hm(Math.floor(e/60),e%60),diaMin)};};
  const SEQ=[1,2,1,1,3]; // 5x2 · 2ª folga das não-âncoras: ter, qua, ter, ter, qui… (quarta sempre com mais gente que terça)
  const SEQ6=[0,0,1,0,2,0,1]; // 6x1 · única folga das não-âncoras: seg, seg, ter, seg, qua… (segunda no mínimo)
  ['C','S'].forEach(a=>{
    const grp=ps.filter(p=>(p.area||'S')===a);if(!grp.length)return;
    const PI=pisoDe(cfg),nAnc=Math.max(1,Math.min(grp.length,a==='C'?Math.max(PI.abreC,PI.fechaC):Math.max(PI.abreS,PI.fechaS)));
    let anc=grp.filter(p=>p.ancora);if(anc.length<nAnc){grp.forEach(p=>{if(anc.length<nAnc&&!p.ancora){p.ancora=true;anc.push(p);}});}
    anc=anc.slice(0,nAnc);const rest=grp.filter(p=>!anc.includes(p));
    const fol={};
    const AF1=[[1,3],[2,3],[1,2],[2,4],[3,4]],AF1c=[[0,1],[3,4],[0,4],[1,3],[0,3]],AF6=[[1],[2],[3],[1],[2]],AF6c=[[0],[4],[3],[0],[4]];
    if(nFol===1){if(com){anc.forEach((p,i)=>fol[p.id]=AF6c[i%AF6c.length]);rest.forEach(p=>fol[p.id]=[6]);}
      else{anc.forEach((p,i)=>fol[p.id]=AF6[i%AF6.length]);rest.forEach((p,i)=>fol[p.id]=[SEQ6[i%SEQ6.length]]);}}
    else if(com){anc.forEach((p,i)=>fol[p.id]=AF1c[i%AF1c.length]);rest.forEach(p=>fol[p.id]=[5,6]);}
    else{ // 5x2 padrão: âncoras com folgas JUNTAS (benefício das posições-base), demais com folgas separadas; busca o arranjo com melhor curva seg<ter<qua≤qui
      const r=folgas5x2(anc.length,rest.length,grp.length,w=>a==='C'?(isAlm?PI.abreC:PI.fechaC):(isAlm?PI.abreS:PI.fechaS));
      anc.forEach((p,i)=>fol[p.id]=r.anc[i]);rest.forEach((p,i)=>fol[p.id]=r.rest[i]);}
    const doms=[2,3,4,1];grp.forEach((p,i)=>{p.domingo=anc.includes(p)?(anc.indexOf(p)===0?2:3):(com?0:doms[(i)%4]);});
    grp.forEach(p=>{p.semana=[];for(let w=0;w<7;w++)p.semana[w]=fol[p.id].includes(w)?{tipo:'FOLGA'}:{tipo:'T',...(anc.includes(p)?hAnc(w):hRef(w))};});
    // promoção baked-in: cada dia precisa de 2 com horário de âncora
    for(let w=0;w<7;w++){let n=grp.filter(p=>p.semana[w].tipo==='T'&&p.semana[w].e===hAnc(w).e).length;
      for(const p of rest){if(n>=nAnc)break;if(p.semana[w].tipo==='T'&&p.semana[w].e!==hAnc(w).e){p.semana[w]={tipo:'T',...hAnc(w)};n++;}}}
    grp.forEach(p=>{p.hSub=subDe(p.semana[6]);});
  });
  // reordena o turno: todos os C primeiro (âncoras antes), depois todos os S
  const ord=p=>((p.area||'S')==='C'?0:100)+(p.ancora?0:50)+ps.indexOf(p)/1000;
  const sorted=ps.slice().sort((x,y)=>ord(x)-ord(y));
  const first=cfg.posicoes.findIndex(p=>p.secao===sec);
  cfg.posicoes=cfg.posicoes.filter(p=>p.secao!==sec);cfg.posicoes.splice(first,0,...sorted);
  save();render();toast(`${SECOES[sec].nome}: padrão montado para ${ps.length} posições`);
}

function doDup(id){
  const src=cfgOf(id),loja=document.getElementById('dupLoja').value.trim(),cid=document.getElementById('dupCid').value;
  const A=document.getElementById('dupA').value,F=document.getElementById('dupF').value,shift=document.getElementById('dupShift').checked;
  const err=document.getElementById('dupErr');
  if(!loja){err.textContent='Informe o nome da nova loja';return;}
  const regSel=(document.getElementById('dupReg')||{}).value||'keep',regNew=regSel==='keep'?regimeOf(src):regSel;
  const clash=state.lojasCfg.find(c=>c.loja===loja&&regimeOf(c)===regNew);
  if(clash){err.textContent=`Não é possível criar dois espelhos para a mesma loja com o mesmo tipo de escala (${loja} já tem ${regNew}).`;return;}
  if(!A||!F){err.textContent='Informe abertura e fechamento';return;}
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  const c={id:uid(),loja,cidade:cid,clusterLoja:document.getElementById('dupCL').value,clusterDelivery:document.getElementById('dupCD').value,tipo:document.getElementById('dupTipo').value,turnos:src.turnos,
    piso:{...pisoDe(src)},pisoAlmocoPct:src.pisoAlmocoPct,perfil:src.perfil||'padrao',hLoja:Array.from({length:7},()=>({a:A,f:F})),hVendas:Array.from({length:7},()=>({a:A,f:F})),excecoes:{},nomes:{},status:{},criadoEm:new Date().toISOString(),baseDe:src.loja};
  c.posicoes=src.posicoes.map(p=>{
    const np={...p,id:uid(),semana:(p.semana||[]).map(x=>({...x})),hSub:{...(p.hSub||{e:'',s:''})}};
    if(shift){const abre=(p.secao==='almoco'||p.secao==='lideranca');
      np.semana=np.semana.map((x,w)=>{if(!x||x.tipo!=='T')return x;const d=abre?toMin(A)-toMin(src.hLoja[w].a):toMin(F)-toMin(src.hLoja[w].f);return isNaN(d)||!d?x:{tipo:'T',e:addM(x.e,d),s:addM(x.s,d)};});
      if(np.hSub.e){const d=abre?toMin(A)-toMin(src.hLoja[6].a):toMin(F)-toMin(src.hLoja[6].f);if(d&&!isNaN(d))np.hSub={e:addM(np.hSub.e,d),s:addM(np.hSub.s,d)};}}
    return np;});
  const reg=regSel;
  state.lojas=[...new Set([...(state.lojas||[]),loja])];state.lojasCfg.push(c);
  if(reg!=='keep'){c.posicoes.forEach(p=>{if(p.secao==='lideranca')return;p.formato=reg;p.contrato=reg==='6x1'?'CLT 6x1':'CLT';});
    cur=c;view={name:'semana',id:c.id};const _confirm=window.confirm;window.confirm=()=>true;try{secoesDo(c).filter(x=>x!=='lideranca'&&c.posicoes.some(p=>p.secao===x)).forEach(x=>autoPadrao(x));}finally{window.confirm=_confirm;}}
  save(true);closeModal();openSemana(c.id);toast(`Espelho de ${loja} criado a partir de ${src.loja}${reg!=='keep'?' · regime '+reg:''}`);
}

/* ========================================================================
   AJUSTE FINO · realinha os horários de reforço à curva de transações da loja
   - mantém: nº de posições, duração de cada turno (horas), folgas, âncoras (abre/fecha), regras da rede
   - mexe: hora de entrada/saída das posições de reforço, dia a dia da semana
   ======================================================================== */
function ajusteFino(id){
  const cfg=cfgOf(id),curva=curvaDe(cfg);
  if(!curva){toast(`Sem curva de vendas para “${cfg.loja}” (importe o Excel em Configurações)`);return;}
  const res=calcAjusteFino(cfg,curva);
  const m=document.getElementById('modal');
  const D=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const dayHTML=res.dias.map((d,w)=>{if(!d)return '';const mx=Math.max(1,...d.need,...d.before,...d.after);
    const bar=(v,c)=>`<i style="height:${Math.round(v/mx*28)}px;background:${c}"></i>`;
    return `<div class="af-day"><b>${D[w]}</b><span class="hint">${d.trans.toFixed(0)} trans · ${d.pessoasHora.toFixed(0)} pessoas-hora</span>
      <div class="af-bars">${d.hours.map((h,i)=>`<div class="af-col" title="${h}h · demanda ${d.need[i].toFixed(1)} · antes ${d.before[i]} · depois ${d.after[i]}">${bar(d.need[i],'#E8E2D2')}${bar(d.before[i],'#9DB9C8')}${bar(d.after[i],'#7A3E9D')}<small>${h%24}</small></div>`).join('')}</div>
      <div class="hint">déficit nos picos: antes ${d.defBefore.toFixed(1)} → depois <b>${d.defAfter.toFixed(1)}</b>${d.pisoAlm?` · piso 12–14h: ${d.pisoAlm}`:''}</div></div>`;}).join('');
  const chg=res.changes;
  m.innerHTML=`<div class="modal" style="width:960px;max-width:96vw;max-height:92vh;overflow:auto"><h2>⚡ Ajuste fino · ${esc(cfg.loja)} ${regimeTag(cfg)}</h2><div class="hint" style="margin-top:-6px">${cfg.ajusteFinoEm?`Último ajuste fino aplicado em ${new Date(cfg.ajusteFinoEm).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · vale para todos os meses.`:'Nunca aplicado nesta loja.'} ${res.changes.length?'':'<b>Nada a mudar: o padrão já está ajustado.</b>'}</div>
    <div class="hint">Curva de transações por hora (Fev–Mar/26, canal Todos) × cobertura do padrão semanal. Barras: <i class="af-lg" style="background:#E8E2D2"></i> demanda · <i class="af-lg" style="background:#9DB9C8"></i> pessoas antes · <i class="af-lg" style="background:#7A3E9D"></i> pessoas depois. Horas, folgas, âncoras e nº de posições não mudam; só a hora em que o reforço entra e sai. Piso do almoço (12–14h): ${cfg.pisoAlmocoPct==null?50:cfg.pisoAlmocoPct}% do pico do dia (ajustável em ⚙ Parâmetros).</div>
    <div class="af-grid">${dayHTML}</div>
    <h2 style="margin-top:14px;font-size:14px">${chg.length} alteração(ões) proposta(s)</h2>
    ${chg.length?`<div class="af-list">${chg.map(c=>`<span><b>${c.code}</b> ${D[c.w]}: ${c.from} → <b>${c.to}</b></span>`).join('')}</div>`:'<div class="hint">O padrão já está alinhado à curva — nada a mudar.</div>'}
    ${res.avisos.length?`<div class="hint" style="margin-top:8px;color:#8A3B00">${res.avisos.map(esc).join('<br>')}</div>`:''}
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="closeModal()">Cancelar</button>${chg.length?`<button class="btn orange" onclick="aplicarAjusteFino('${id}')">Aplicar ${chg.length} alteração(ões)</button>`:''}</div></div>`;
  m.classList.add('show');ajusteFino._res=res;
}
function aplicarAjusteFino(id){const cfg=cfgOf(id),res=ajusteFino._res;if(!res)return;cortarVersao(cfg);
  res.changes.forEach(c=>{const p=cfg.posicoes.find(x=>x.id===c.pid);if(!p)return;const old=p.semana[c.w]||{};p.semana[c.w]={tipo:'T',e:c.e,s:c.s,...(old.pausa?{pausa:old.pausa}:{})};});
  cfg.posicoes.forEach(p=>{if(p.secao==='lideranca')return;const d=p.semana[6];if(d&&d.tipo==='T')p.hSub=subDe(d);});
  cfg.ajusteFinoEm=new Date().toISOString();cur=cfg;save();closeModal();render();toast(`Ajuste fino aplicado: ${res.changes.length} horário(s)`);
}
function calcAjusteFino(cfg,curva){
  const team=cfg.posicoes.filter(p=>p.secao!=='lideranca'),codes=codesOf(cfg),changes=[],avisos=[],dias=[];
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  for(let w=0;w<7;w++){
    const hl=cfg.hLoja[w],A=toMin(hl.a),F0=toMin(hl.f);if(A==null||F0==null){dias.push(null);continue;}const F=F0<=A?F0+1440:F0;
    const slots=[];for(let t=Math.floor(A/30)*30;t<F;t+=30)slots.push(t);
    const dem=slots.map(t=>(curva[w][Math.floor(t/60)%24]||0)/2);const demTot=dem.reduce((a,b)=>a+b,0);
    // estado do dia: {pid, e, s(min), span, fixo}
    const st=team.map(p=>{const c=(p.semana||[])[w];if(!c||c.tipo!=='T')return null;const e=toMin(c.e);let s=toMin(c.s);if(e==null||s==null)return null;if(s<=e)s+=1440;
      const abre=e<=A+15,fecha=s>=F-15,fixo=p.ancora||abre||fecha;return {pid:p.id,p,e,s,span:s-e,fixo};}).filter(Boolean);
    const cover=()=>slots.map(t=>st.filter(x=>t>=x.e&&t<x.s).length);
    const before=cover();const ph=before.reduce((a,b)=>a+b,0);
    if(!demTot||!ph){dias.push({hours:slots.filter((_,i)=>i%2===0).map(t=>Math.floor(t/60)),need:[],before:[],after:[],trans:0,pessoasHora:0,defBefore:0,defAfter:0});continue;}
    const k=ph/demTot,need=dem.map(d=>d*k);
    // equilíbrio almoço × jantar: a meta de pessoas nos picos (12–14h e 18–21h) é redistribuída na proporção escolhida (almoço forte 65/35 · equilíbrio 50/50 · jantar forte 35/65)
    const pct=cfg.pisoAlmocoPct==null?50:+cfg.pisoAlmocoPct,shareL=pct>=75?0.65:pct<=37?0.35:0.5;
    const lunch=slots.map(t=>t>=12*60&&t<14*60),dinner=slots.map(t=>t>=18*60&&t<21*60);
    {const nL=lunch.filter(Boolean).length,nD=dinner.filter(Boolean).length;
      if(nL&&nD){const L=need.reduce((a,v,i)=>a+(lunch[i]?v:0),0)/nL,D=need.reduce((a,v,i)=>a+(dinner[i]?v:0),0)/nD;const T=L+D;
        if(T>0){const L2=shareL*T,D2=(1-shareL)*T,fL=L>0?L2/L:1,fD=D>0?D2/D:1;for(let i=0;i<need.length;i++){if(lunch[i])need[i]*=fL;else if(dinner[i])need[i]*=fD;}}}}
    const pisoAlm=Math.ceil(Math.max(...need.filter((_,i)=>lunch[i]),0));
    const obj=cv=>{let o=0;for(let i=0;i<cv.length;i++){const g=need[i]-cv[i];o+=g>0?g*g:0.3*g*g;if((lunch[i]||dinner[i])&&g>0)o+=2*g*g;}return o;};
    const defic=cv=>{let d=0;for(let i=0;i<cv.length;i++){const g=need[i]-cv[i];if(g>0)d+=g;}return d/2;};
    // janela de entrada por seção: almoço perto da abertura; noite/madrugada a partir das 11h até o fechamento
    const modoAJ=shareL>0.5?'almoco':shareL<0.5?'jantar':'eq';
    const win=x=>{const sec=x.p.secao;let lo,hi;if(sec==='almoco'){lo=A;hi=Math.min(modoAJ==='almoco'?A+60:A+4*60,F-x.span);}else{lo=modoAJ==='jantar'?Math.max(A,F-x.span-60):Math.max(A,11*60);hi=F-x.span;}if(hi<lo)hi=lo;return [lo,hi];};
    let best=obj(cover());
    for(let pass=0;pass<3;pass++){let moved=false;
      for(const x of st){if(x.fixo)continue;const [lo,hi]=win(x);let bestE=x.e,bestO=best;
        for(let e=lo;e<=hi;e+=30){if(e===x.e)continue;const oe=x.e,os=x.s;x.e=e;x.s=e+x.span;const o=obj(cover());x.e=oe;x.s=os;if(o<bestO-0.01){bestO=o;bestE=e;}}
        if(bestE!==x.e){x.e=bestE;x.s=bestE+x.span;best=bestO;moved=true;}}
      if(!moved)break;}
    const after=cover();
    st.forEach(x=>{const c=x.p.semana[w];const e=hm(Math.floor(x.e/60)%24,x.e%60),s2=hm(Math.floor(x.s/60)%24,x.s%60);if(e!==c.e||s2!==c.s)changes.push({pid:x.pid,code:codes[x.pid],w,from:c.e+'–'+c.s,to:e+'–'+s2,e,s:s2});});
    const hourIdx=slots.map((t,i)=>i).filter(i=>i%2===0);
    dias.push({pisoAlm,hours:hourIdx.map(i=>Math.floor(slots[i]/60)),need:hourIdx.map(i=>need[i]+(need[i+1]||0)),before:hourIdx.map(i=>Math.max(before[i],before[i+1]||0)),after:hourIdx.map(i=>Math.max(after[i],after[i+1]||0)),trans:demTot,pessoasHora:ph/2,defBefore:defic(before),defAfter:defic(after)});
  }
  const late=changes.filter(c=>toMin(c.e)>12*60&&cfg.posicoes.find(p=>p.id===c.pid).secao==='noite');
  if(late.length)avisos.push(`${late.length} reforço(s) da Noite passam a entrar depois das 12h — a curva pede mais gente no fim da noite do que no almoço nesses dias.`);
  return {changes,avisos,dias};
}
/* ---------- importar curva de vendas (Excel · aba _DadosResumo) ---------- */
function importarCurva(f){if(!f)return;if(typeof XLSX==='undefined'){const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>importarCurva(f);document.head.appendChild(sc);return;}
  const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const ws=wb.Sheets['_DadosResumo'];if(!ws)throw new Error('sem aba _DadosResumo');
    const rows=XLSX.utils.sheet_to_json(ws,{header:1});const dias={'segunda-feira':0,'terça-feira':1,'quarta-feira':2,'quinta-feira':3,'sexta-feira':4,'sábado':5,'domingo':6};const out={};
    rows.slice(1).forEach(rw=>{const [loja,canal,dia,hora,med]=rw;if(canal!=='Todos')return;const w=dias[String(dia||'').toLowerCase()];if(w==null||loja==='Todas')return;out[loja]=out[loja]||Array.from({length:7},()=>Array(24).fill(0));const h=parseInt(hora);if(h>=0&&h<24)out[loja][w][h]=Math.round(parseFloat(med)*10)/10;});
    state.curvas=out;save(true);toast(`Curva importada: ${Object.keys(out).length} lojas`);closeModal();}catch(e){toast('Arquivo inválido: '+e.message);}};r.readAsArrayBuffer(f);}
