    <div class="hint">Senha padrão das lojas: <b>9999</b> (cada gerente altera a sua na tela da loja). Nuvem: ${supaOn()?'<b style="color:var(--green)">conectada</b>':'<b style="color:var(--bad)">sem chave</b> — colar a anon key em SUPA.key no arquivo'}</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="save();closeModal();render();toast('Contratos salvos')">Salvar</button></div></div>`;
  m.classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
/* ---------- usuários (admin) ---------- */
function openUsuarios(){const m=document.getElementById('modal');const lojas=[...new Set([...(state.lojas||[]),...state.lojasCfg.map(c=>c.loja)])].sort();
  const row=u=>`<tr><td><input type="text" value="${esc(u.nome||'')}" placeholder="Nome" style="width:150px" onchange="u_('${u.id}','nome',this.value)"></td><td><input type="text" value="${esc(u.telefone||'')}" placeholder="(11) 9…" style="width:120px" onchange="u_('${u.id}','telefone',this.value)"></td>
    <td><select onchange="u_('${u.id}','perfil',this.value)">${Object.entries(PERFIS).map(([k,l])=>`<option value="${k}" ${u.perfil===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><input type="text" value="${esc(u.senha||'')}" placeholder="senha" style="width:90px" onchange="u_('${u.id}','senha',this.value)"></td><td><button class="del" onclick="delUsuario('${u.id}')">✕</button></td></tr>`;
  m.innerHTML=`<div class="modal" style="width:900px;max-width:96vw;max-height:90vh;overflow:auto"><h2>👥 Usuários e acessos</h2><div class="hint">Admins e Gestores. Nome e telefone dos admins aparecem para a loja quando ela precisa pedir liberação. <b>Gerentes de restaurante não ficam aqui</b>: nome, contato e senha da loja ficam em 🏬 Lojas.</div>
    <div class="row" style="justify-content:space-between;margin:10px 0"><button class="btn sm ghost" onclick="usuarios().push({id:uid(),nome:'',telefone:'',perfil:'gestor',lojas:[],senha:''});openUsuarios()">+ Usuário</button><button class="btn" onclick="save(true);closeModal();toast('Usuários salvos')">Salvar e fechar</button></div>
    <table><tr><th>Nome</th><th>Telefone</th><th>Perfil</th><th>Senha</th><th></th></tr>${usuarios().filter(u=>u.perfil!=='restaurante').map(row).join('')||'<tr><td colspan="5" class="hint">Nenhum usuário. A senha geral do administrador continua valendo.</td></tr>'}</table>
    <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn sm ghost" onclick="usuarios().push({id:uid(),nome:'',telefone:'',perfil:'gestor',lojas:[],senha:''});openUsuarios()">+ Usuário</button><button class="btn" onclick="save(true);closeModal();toast('Usuários salvos')">Salvar e fechar</button></div></div>`;m.classList.add('show');}
function u_(id,f,v){const u=usuarios().find(x=>x.id===id);if(!u)return;u[f]=f==='lojas'?v:String(v).trim();if(f==='perfil')openUsuarios();}
function delUsuario(id){if(!confirm('Excluir este usuário?'))return;state.usuarios=usuarios().filter(x=>x.id!==id);openUsuarios();}
/* ---------- lojas e base de ativos (admin) ---------- */
function openLojasPanel(){const m=document.getElementById('modal');const B=baseDe();
  const nCol=cod=>B.colaboradores.filter(c=>c.loja===cod).length,temEsp=cod=>state.lojasCfg.filter(c=>c.codigo===cod).length;
  const rows=B.lojas.slice().sort((a,b)=>(b.tipoLoja==='Propria')-(a.tipoLoja==='Propria')||a.nome.localeCompare(b.nome)).map(l=>`<tr>
    <td style="color:var(--ink-3);font-size:11px">${esc(l.codigo)}</td><td><input type="text" value="${esc(l.nome)}" style="width:150px" onchange="l_('${l.codigo}','nome',this.value)"></td>
    <td><select onchange="l_('${l.codigo}','tipoLoja',this.value)"><option ${l.tipoLoja==='Propria'?'selected':''} value="Propria">Própria</option><option ${l.tipoLoja==='Franquia'?'selected':''} value="Franquia">Franquia</option></select></td>
    <td><input type="text" value="${esc(l.gerente.nome||'')}" placeholder="Gerente" style="width:140px" onchange="l_('${l.codigo}','g.nome',this.value)"></td><td><input type="text" value="${esc(l.gerente.email||'')}" placeholder="e-mail" style="width:170px" onchange="l_('${l.codigo}','g.email',this.value)"></td><td><input type="text" value="${esc(l.gerente.telefone||'')}" placeholder="telefone" style="width:110px" onchange="l_('${l.codigo}','g.telefone',this.value)"></td>
    <td>${temEsp(l.codigo)?`<input type="text" value="${esc((state.lojasCfg.find(c=>c.codigo===l.codigo)||{}).senha||'9999')}" style="width:80px;font-family:monospace" title="Senha da loja para o gerente entrar na aba Restaurante" onchange="setSenhaLoja('${l.codigo}',this.value)">`:'<span class="hint">—</span>'}</td><td style="text-align:center">${temEsp(l.codigo)?'✔':'<button class="btn sm ghost" onclick="closeModal();startNovo();setTimeout(()=>{draft.loja=\''+esc(l.nome).replace(/'/g,'')+'\';render();},0)">criar</button>'}</td>
    <td>${nCol(l.codigo)||temEsp(l.codigo)?'':`<button class="del" onclick="delLojaBase('${l.codigo}')">✕</button>`}</td></tr>`).join('');
  m.innerHTML=`<div class="modal" style="width:1100px;max-width:97vw;max-height:92vh;overflow:auto"><h2>🏬 Lojas e base de ativos</h2>
    <div class="hint">Base de ativos: <b>${B.atualizadoEm||'—'}</b> · ${B.colaboradores.length} colaboradores em ${B.lojas.filter(l=>nCol(l.codigo)).length} lojas. O nome aqui é o que aparece nos espelhos (renomear aqui renomeia o espelho). Lojas sem colaboradores na base (franquias) permitem digitar nomes livremente.</div>
    <div class="row" style="margin:8px 0;gap:8px"><label class="btn sm ghost" style="cursor:pointer">⬆ Importar BaseAtivos (.xlsx)<input type="file" accept=".xlsx" style="display:none" onchange="importarBase(this.files[0])"></label><button class="btn sm ghost" onclick="B_novaLoja()">+ Loja nova</button><button class="btn sm" onclick="openMetas()">📊 Metas de quadro por mês</button><span style="flex:1"></span><button class="btn" onclick="save(true);closeModal();render();toast('Lojas salvas')">Salvar e fechar</button></div>
    <table><tr><th>Cód.</th><th>Loja</th><th>Tipo</th><th>Gerente</th><th>E-mail</th><th>Telefone</th><th title="Senha que o gerente usa na aba Restaurante. Padrão 9999.">Senha (Restaurante)</th><th>Espelho</th><th></th></tr>${rows}</table>

    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="save(true);closeModal();render();toast('Lojas salvas')">Salvar e fechar</button></div></div>`;m.classList.add('show');}
function l_(cod,f,v){const l=lojaBase(cod);if(!l)return;v=String(v).trim();if(f==='nome'){if(!v)return;state.lojasCfg.forEach(c=>{if(c.codigo===cod){if(!c.lojaAntiga)c.lojaAntiga=c.loja;c.loja=v;dirty.cfg.add(c.id);}});l.nome=v;}else if(f.startsWith('g.'))l.gerente[f.slice(2)]=v;else if(f.startsWith('q.')){l.quadro=l.quadro||{};if(v==='')delete l.quadro[f.slice(2)];else l.quadro[f.slice(2)]=+v;if(!Object.keys(l.quadro).length)delete l.quadro;}else l[f]=v;dirty.config=true;}
function setSenhaLoja(cod,v){v=String(v).trim();if(v.length<4||v.length>12){toast('Senha: 4 a 12 caracteres');openLojasPanel();return;}state.lojasCfg.forEach(c=>{if(c.codigo===cod){c.senha=v;dirty.cfg.add(c.id);}});save();toast('Senha da loja alterada');}
function B_novaLoja(){const n=(prompt('Nome da loja nova (sem "Cabana"):')||'').trim();if(!n)return;if(lojaBasePorNome(n)){toast('Já existe');return;}const B=baseDe();const cod='N'+String(B.lojas.filter(l=>/^N/.test(l.codigo)).length+1).padStart(2,'0');B.lojas.push({codigo:cod,nome:n,nomeBase:'',tipoLoja:'Franquia',gerente:{nome:'',email:'',telefone:''}});save(true);openLojasPanel();}
function delLojaBase(cod){if(!confirm('Remover esta loja da lista?'))return;const B=baseDe();B.lojas=B.lojas.filter(l=>l.codigo!==cod);save(true);openLojasPanel();}
function importarBase(f){if(!f)return;if(typeof XLSX==='undefined'){const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>importarBase(f);document.head.appendChild(sc);return;}
  const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1}).slice(1);
    const SM=new Set(['da','de','do','dos','das','e','di']);const tc=x=>String(x||'').trim().toLowerCase().split(/\s+/).map((w,i)=>!w?'':(SM.has(w)&&i>0?w:w[0].toUpperCase()+w.slice(1))).join(' ');
    const cargo=c=>{c=String(c||'').toUpperCase();return c.includes('GERENTE')?'Gerente':c.includes('COORDENADOR')?'Coordenador':c.includes('ATENDENTE')?'Atendente':'Assistente';};
    const B=baseDe();const cols=[];let novas=0;
    rows.forEach(rw=>{if(!rw||!rw[0]||!rw[1])return;const raw=String(rw[0]).trim();const mm=raw.match(/^\s*(\d+)\s*-\s*CABANA\s+(.*)$/i);const cod=mm?mm[1]:raw,nome=tc((mm?mm[2]:raw).replace(/\b(SHOP|VL)\b/gi,' ').replace(/\s+/g,' ').trim());
      let L=lojaBase(cod)||lojaBasePorNome(nome);if(!L){L={codigo:cod,nome,nomeBase:raw,tipoLoja:'Propria',gerente:{nome:'',email:'',telefone:''}};B.lojas.push(L);novas++;}else{L.nomeBase=raw;}
      cols.push({loja:L.codigo,nome:tc(rw[1]),cargo:cargo(rw[2]),area:String(rw[3]||'').toUpperCase().startsWith('COZ')?'C':'S'});});
    if(!cols.length)throw new Error('nenhuma linha reconhecida (esperado: Loja · Nome · Cargo)');
    B.colaboradores=cols;B.atualizadoEm=new Date().toLocaleDateString('pt-BR');save(true);toast(`Base importada: ${cols.length} pessoas · ${novas} loja(s) nova(s)`);openLojasPanel();}catch(e){toast('Arquivo inválido: '+e.message);}};r.readAsArrayBuffer(f);}
/* ---------- metas de quadro por loja × mês (admin) ---------- */
function openMetas(){const m=document.getElementById('modal');const B=baseDe();const t=todayYM();const ms=[];for(let i=0;i<=12;i++){let y=t.y,mm=t.m+i;while(mm>11){mm-=12;y++;}ms.push({y,m:mm,k:ym(y,mm)});}
  const lojas=B.lojas.slice().sort((a,b)=>(b.tipoLoja==='Propria')-(a.tipoLoja==='Propria')||a.nome.localeCompare(b.nome));
  const cell=(l,k,f)=>{const M=l.metas||{},v=(M[k]||{})[f];const her=v==null?(()=>{const ks=Object.keys(M).filter(x=>x<k).sort();const kk=ks[ks.length-1];return kk?(M[kk]||{})[f]:null;})():null;
    return `<input type="number" min="0" max="${f==='lid'?9:60}" value="${v??''}" placeholder="${her??'—'}" class="mt ${v==null?'her':''}" onchange="m_('${l.codigo}','${k}','${f}',this.value)">`;};
  const rows=lojas.map(l=>{const esp=state.lojasCfg.filter(c=>c.codigo===l.codigo);return `<tr><td class="st c0" style="min-width:150px;text-align:left;font-weight:800;padding-left:6px">${esc(l.nome)}<small style="display:block;font-weight:600;color:var(--ink-3)">${l.tipoLoja==='Franquia'?'Franquia':'Própria'}${esp.length?` · espelho ${esp[0].posicoes.filter(p=>p.secao==='lideranca').length}+${esp[0].posicoes.filter(p=>p.secao!=='lideranca').length}`:' · sem espelho'}</small></td>${ms.map(x=>`<td>${cell(l,x.k,'lid')}</td><td class="sep">${cell(l,x.k,'equipe')}</td>`).join('')}</tr>`;}).join('');
  m.innerHTML=`<div class="modal" style="width:96vw;max-width:96vw;max-height:94vh;overflow:auto"><h2>📊 Metas de quadro por loja × mês</h2>
    <div class="hint"><b>Lid</b> = posições de liderança · <b>Eq</b> = posições de equipe (atendentes/assistentes). Preencha só quando mudar: um mês em branco herda a meta do último mês preenchido (mostrada em cinza). Com meta, o espelho daquele mês tem que ter exatamente esse número — o Gestor não inclui/exclui fora dela e a escala do mês só publica se bater. Sem nenhuma meta = sem controle.</div>
    <div class="row" style="justify-content:flex-end;margin:10px 0;gap:8px"><button class="btn ghost" onclick="openLojasPanel()">← Lojas</button><button class="btn" onclick="save(true);closeModal();render();toast('Metas salvas')">Salvar e fechar</button></div>
    <div class="scroll"><table class="esc metas"><tr><th class="st c0">Loja</th>${ms.map(x=>`<th colspan="2">${MESES[x.m].slice(0,3)}/${String(x.y).slice(2)}</th>`).join('')}</tr><tr><th class="st c0"></th>${ms.map(()=>'<th>Lid</th><th class="sep">Eq</th>').join('')}</tr>${rows}</table></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px;gap:8px"><button class="btn ghost" onclick="openLojasPanel()">← Lojas</button><button class="btn" onclick="save(true);closeModal();render();toast('Metas salvas')">Salvar e fechar</button></div></div>`;m.classList.add('show');}
function m_(cod,k,f,v){const l=lojaBase(cod);if(!l)return;l.metas=l.metas||{};l.metas[k]=l.metas[k]||{};if(v==='')delete l.metas[k][f];else l.metas[k][f]=+v;if(!Object.keys(l.metas[k]).length)delete l.metas[k];dirty.config=true;}
/* ---------- travas por mês (admin) ---------- */
function openTravas(){const m=document.getElementById('modal');const t=todayYM();const ms=[];for(let i=-1;i<=12;i++){let y=t.y,mm=t.m+i;while(mm<0){mm+=12;y--;}while(mm>11){mm-=12;y++;}if(ymIdx(y,mm)<ymIdx(INICIO.y,INICIO.m))continue;ms.push({y,m:mm});}
  const rows=ms.map(({y,m:mm})=>{const k=ym(y,mm),tv=travaDe(k),ok=mesEditavelLoja(y,mm),pz=prazoDe(y,mm);const st=ok?(tv==='liberado'?'🔓 liberado pelo admin':'✎ aberto (prazo '+String(pz.getDate()).padStart(2,'0')+'/'+String(pz.getMonth()+1).padStart(2,'0')+')'):'🔒 '+motivoTrava(y,mm);
    return `<tr><td><b>${MESES[mm]} ${y}</b></td><td>${st}</td><td><div class="row" style="gap:6px">${['auto','liberado','travado'].map(v=>`<button class="btn sm ${tv===v?'':'ghost'}" onclick="setTrava('${k}','${v}')">${v==='auto'?'Regra (dia 20)':v==='liberado'?'Liberar':'Travar'}</button>`).join('')}</div></td></tr>`;}).join('');
  m.innerHTML=`<div class="modal" style="width:760px;max-width:96vw;max-height:90vh;overflow:auto"><h2>🔒 Travas por mês · edição pela loja</h2><div class="hint"><b>Regra:</b> a loja preenche nomes e ausências do mês até o <b>dia 20 do mês anterior</b> (ex.: dezembro até 20/11). Depois disso o mês trava e só o admin libera. Janela da loja: mês corrente + 2. Admin e Gestor editam sempre.</div>
    <div class="row" style="justify-content:flex-end;margin:10px 0"><button class="btn" onclick="closeModal()">Fechar</button></div>
    <table><tr><th>Mês</th><th>Situação para a loja</th><th>Ação</th></tr>${rows}</table>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">Fechar</button></div></div>`;m.classList.add('show');}
document.getElementById('modal').addEventListener('mousedown',ev=>{if(ev.target.id==='modal')closeModal();});






/* ---------- limpeza única: exceções de equipe de nov/2026 criadas pela migração (regra de feriado passa a valer) ---------- */
(function cleanNov26(){
  if(state.clean_nov26)return;
  state.lojasCfg.forEach(cfg=>{const lid=new Set(cfg.posicoes.filter(p=>p.secao==='lideranca').map(p=>p.id));
    Object.keys(cfg.excecoes||{}).forEach(k=>{if(!k.startsWith('2026-11'))return;Object.keys(cfg.excecoes[k]).forEach(pid=>{if(!lid.has(pid))delete cfg.excecoes[k][pid];});if(!Object.keys(cfg.excecoes[k]).length)delete cfg.excecoes[k];});});
  state.clean_nov26=true;save();
})();

/* ---------- ajuste único · Morumbi 5x2: reforço Almoço 10:00→11:30; reforço Noite 12:00→11:30 c/ pausa 2h (sex/sáb/dom) ---------- */
function fixLiderancaDomingo(){ // regra da rede: gerente folga domingo sim, domingo não; coordenadores 1 domingo a cada 4 semanas, nunca no domingo do gerente
  let n=0;state.lojasCfg.forEach(cfg=>{const lid=cfg.posicoes.filter(p=>p.secao==='lideranca');const ger=lid.filter(p=>p.cargo==='Gerente'),co=lid.filter(p=>p.cargo!=='Gerente');let ch=false;
    ger.forEach(p=>{if(p.domingo!=='alt'){p.domingo='alt';ch=true;}if((!p.hSub||!p.hSub.e)&&p.semana&&p.semana[6]&&p.semana[6].tipo==='T')p.hSub=subDe(p.semana[6]);});
    co.forEach((p,i)=>{if(p.domingo!=='q1'&&p.domingo!=='q3'){p.domingo=i%2?'q3':'q1';ch=true;}});
    // exceções lançadas à mão sobre a liderança (sobras da conversão do espelho mensal antigo) deixam de valer: a regra nova manda
    Object.entries(cfg.excecoes||{}).forEach(([k,mp])=>{lid.forEach(p=>{if(mp[p.id]){delete mp[p.id];ch=true;}});if(!Object.keys(mp).length)delete cfg.excecoes[k];});
    if(ch){n++;dirty.cfg.add(cfg.id);}});
  if(n){save();toast(`Liderança: regra de domingo atualizada em ${n} espelho(s)`);}
}
function fixMorumbiReforco(){ // idempotente: roda após carregar a nuvem
  const addM=(t,m)=>{let x=toMin(t)+m;x=((x%1440)+1440)%1440;return hm(Math.floor(x/60),x%60);};
  let n=0;state.lojasCfg.filter(c=>c.loja==='Morumbi'&&regimeOf(c)==='5x2').forEach(cfg=>{
    cfg.posicoes.filter(p=>p.secao!=='lideranca').forEach(p=>(p.semana||[]).forEach((c,w)=>{if(!c||c.tipo!=='T')return;
      if(p.secao==='almoco'&&c.e==='10:00'){c.e='11:30';c.s=addM(c.s,90);n++;}
      if(p.secao==='noite'&&w>=4&&c.e==='12:00'){c.e='11:30';c.s=addM(c.s,30);c.pausa=120;n++;}}));
    cfg.posicoes.forEach(p=>{const d=(p.semana||[])[6];if(p.secao!=='lideranca'&&d&&d.tipo==='T')p.hSub=subDe(d);});
    dirty.cfg.add(cfg.id);});
  if(n){save();toast(`Morumbi: ${n} horários de reforço ajustados (10:00→11:30 · 12:00→11:30 c/ pausa 2h sex–dom)`);}
}
render();
supaLoad();
